<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>率土之滨卡池</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;padding:12px}.app{max-width:430px;margin:auto}h1{font-size:21px;margin:0 0 6px}.sub{font-size:13px;color:#666;margin-bottom:10px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}button{min-height:42px;border:1px solid #d5d8dc;border-radius:10px;background:#fff;font-size:14px}.jump{display:grid;grid-template-columns:1fr 84px;gap:7px;margin-bottom:10px}.jump input{height:42px;border:1px solid #d5d8dc;border-radius:10px;padding:0 10px;font-size:16px}.card{background:#fff;border:1px solid #e4e6e8;border-radius:12px;padding:9px;margin-bottom:8px}.card.sel{outline:2px solid #f0b429}.row{display:grid;grid-template-columns:28px 34px minmax(0,1fr) 86px;gap:6px;align-items:center}.owned{width:22px;height:22px}.idx{font-size:12px;color:#777;text-align:center}.name,.note{width:100%;min-width:0;height:38px;border:1px solid #e3e5e8;border-radius:8px;padding:0 8px;font-size:16px}.moves{display:flex;gap:5px}.moves button{width:40px;min-height:38px;font-size:20px;font-weight:700;padding:0}.row2{display:grid;grid-template-columns:minmax(0,1fr) 58px;gap:7px;margin-top:7px}.note{font-size:14px}.del{min-height:38px;font-size:13px}.footer{font-size:12px;color:#777;line-height:1.45;margin:10px 2px}@media(max-width:360px){.row{grid-template-columns:26px 30px minmax(0,1fr) 78px}.moves button{width:36px}.name{font-size:15px}}</style></head><body><div class="app"><h1>率土之滨 · 我的卡池</h1><div class="sub">勾选、改名、备注、↑↓排序；点卡片空白处后可移动到指定位置。修改自动保存在本机浏览器。</div><div class="tools"><button id="add">＋新增武将</button><button id="ownedFirst">已拥有优先</button><button id="original">恢复原顺序</button><button id="copy">复制为文字</button></div><div class="jump"><input id="target" type="number" inputmode="numeric" min="1" placeholder="移动到第几位"><button id="move">移动</button></div><div id="list"></div><div class="footer">整理完点“复制为文字”，把结果粘贴回 ChatGPT 即可。</div></div><script>const names=["张绣","曹丕","普通祝融夫人","五星蒋钦","周泰","孙策","何太后","灵帝","汉董卓","周瑜","陆抗","SP太史慈","五星庞德","大乔与小乔","汉袁绍","普通夏侯渊","孙鲁班","普通周姬","张宁","五星吕姬","魏荀彧","甘宁","普通卢植","普通孙尚香","小乔","汉貂蝉","五星汉曹操","曹植","曹仁","郝昭","木鹿大王","陈宫","魏司马懿","步皇后"];const key='stzb_cards_v1',list=document.getElementById('list');let sel=null;function data(){try{return JSON.parse(localStorage.getItem(key))||names.map((n,i)=>({o:i+1,x:1,n,t:''}))}catch(e){return names.map((n,i)=>({o:i+1,x:1,n,t:''}))}}let d=data();function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}function render(){list.innerHTML='';d.forEach((c,i)=>{let el=document.createElement('div');el.className='card';el.dataset.i=i;el.innerHTML=`<div class="row"><input class="owned" type="checkbox" ${c.x?'checked':''}><span class="idx">${String(i+1).padStart(2,'0')}</span><input class="name" value="${esc(c.n)}"><div class="moves"><button class="up">↑</button><button class="down">↓</button></div></div><div class="row2"><input class="note" value="${esc(c.t||'')}" placeholder="版本 / 备注"><button class="del">删除</button></div>`;if(sel===i)el.classList.add('sel');list.appendChild(el)});save()}function save(){localStorage.setItem(key,JSON.stringify(d))}list.addEventListener('click',e=>{let card=e.target.closest('.card');if(!card)return;let i=+card.dataset.i;if(e.target.classList.contains('up')&&i>0){[d[i-1],d[i]]=[d[i],d[i-1]];sel=i-1;render();return}if(e.target.classList.contains('down')&&i<d.length-1){[d[i+1],d[i]]=[d[i],d[i+1]];sel=i+1;render();return}if(e.target.classList.contains('del')){d.splice(i,1);sel=null;render();return}if(!e.target.matches('input')){sel=i;render()}});list.addEventListener('change',e=>{let c=e.target.closest('.card');if(!c)return;let i=+c.dataset.i;if(e.target.classList.contains('owned'))d[i].x=e.target.checked?1:0;save()});list.addEventListener('input',e=>{let c=e.target.closest('.card');if(!c)return;let i=+c.dataset.i;if(e.target.classList.contains('name'))d[i].n=e.target.value;if(e.target.classList.contains('note'))d[i].t=e.target.value;save()});document.getElementById('add').onclick=()=>{d.push({o:Date.now(),x:1,n:'新武将',t:''});sel=d.length-1;render()};document.getElementById('ownedFirst').onclick=()=>{d.sort((a,b)=>b.x-a.x);sel=null;render()};document.getElementById('original').onclick=()=>{d.sort((a,b)=>a.o-b.o);sel=null;render()};document.getElementById('move').onclick=()=>{if(sel==null)return alert('先点一下要移动的卡片空白处');let p=parseInt(document.getElementById('target').value,10);if(!p||p<1)return alert('请输入有效位置');p=Math.min(p,d.length)-1;let [x]=d.splice(sel,1);d.splice(p,0,x);sel=p;render()};document.getElementById('copy').onclick=async()=>{let text=d.map((c,i)=>`${c.x?'[x]':'[ ]'} ${String(i+1).padStart(2,'0')} ${c.n}${c.t?' — '+c.t:''}`).join('\n');try{await navigator.clipboard.writeText(text);alert('已复制')}catch(e){prompt('复制下面文字：',text)}};render();</script></body></html>
